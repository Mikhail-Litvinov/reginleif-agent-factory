# Test-only client authentication of the database bench stack (mounted by compose.bench.yml in place of
# deploy/postgres/pg_hba.conf). The production lines are repeated unchanged; the last line is the only addition: the five
# application roles may log in over the network, from the stack's own subnet, to the per-file test databases af_test_*
# (a regular expression in the database field, PostgreSQL 16).
local   all            all                                                              scram-sha-256
host    all            af_bootstrap                                            all      reject
host    agent_factory  af_migrator,af_api,af_control,af_backup,af_reader       samenet  scram-sha-256
host    /^af_test_     af_migrator,af_api,af_control,af_backup,af_reader       samenet  scram-sha-256
