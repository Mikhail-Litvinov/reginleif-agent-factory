# Client authentication of the Agent Factory database server (mounted by compose.yml, read-only).
#
# Every line demands a password checked as scram-sha-256: there is no trust, peer or md5 line.
#   - Local connections (the unix socket inside the container) may use any role. The bootstrap superuser works only
#     here (init and recovery), so it is never reachable through the published port: its host line is a reject.
#   - Network connections reach only two groups, and only from the server's own subnet (`samenet`): the container's
#     compose project network, named <project>_default (agent-factory_default for the real stack), and the host's
#     published loopback port, which Docker delivers from that network's gateway. A container on any other Docker
#     network is refused. The groups: the five application roles into the application database, and the Temporal role
#     af_temporal into its two Temporal databases. No other pairing has a line, so the Temporal role cannot reach
#     agent_factory and no application role can reach a Temporal database.
#   - The server still listens on the container's interface (listen_addresses '*'): Docker's port publishing delivers
#     connections to the container's own address, so a loopback-only listener would break the published port. The
#     restriction is therefore made here, in the host lines, not in the listener.
# Anything else matches no line and is refused.

# TYPE  DATABASE                           USER                                                    ADDRESS  METHOD
local   all                                all                                                              scram-sha-256
host    all                                af_bootstrap                                            all      reject
host    agent_factory                      af_migrator,af_api,af_control,af_backup,af_reader       samenet  scram-sha-256
host    af_temporal,af_temporal_visibility af_temporal                                             samenet  scram-sha-256
