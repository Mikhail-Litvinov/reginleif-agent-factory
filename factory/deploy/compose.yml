# Agent Factory database server (phase 1). Development-only compose file.
#
# Start:  AF_SECRETS_DIR=<directory made by deploy/setup-secrets.ts> docker compose -f factory/deploy/compose.yml up -d
# The stack refuses to start without AF_SECRETS_DIR: there is no default inside the repository, and no password
# text anywhere in this file or in the environment of the container.
# AF_PG_PORT (default 55432) is the port on 127.0.0.1; the server is never published on another address.
# Container, volume and network names derive from the project name, so a test project (-p) never meets this one.

name: agent-factory

services:
  postgres:
    # PostgreSQL 16 with pgvector 0.8.7, pinned by version and by digest (the digest wins; the tag documents it).
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    restart: unless-stopped
    stop_grace_period: 30s
    # The wrapper (deploy/postgres/entrypoint.sh) hands the image's entrypoint the bootstrap password without any
    # variable or argument (and never a trust rule), writes the healthcheck's passfile, and serves a data directory only after a recorded complete initialisation (it refuses one
    # that holds PG_VERSION but no marker): see it and docs/agent-factory/deployment.md "No password in any environment"
    # and "A start that refuses".
    entrypoint: ["bash", "/etc/agent-factory/entrypoint.sh"]
    command: ["postgres", "-c", "hba_file=/etc/agent-factory/pg_hba.conf"]
    environment:
      POSTGRES_USER: af_bootstrap
      POSTGRES_DB: postgres
      # No POSTGRES_PASSWORD, no POSTGRES_PASSWORD_FILE and no POSTGRES_HOST_AUTH_METHOD: a trust rule is never asked
      # for, so none can ever be written to the volume (a SIGKILL at any instant included). The image's check that a
      # password is given is met inside the wrapper process (deploy/postgres/entrypoint.sh), with a constant that is
      # not the secret, so nothing in the container's configuration holds a password. The password reaches initdb
      # through --pwfile (a path to the secret file), and the image's own psql calls authenticate through a libpq
      # service file that the wrapper writes into tmpfs.
      # Checksums on pages, and scram-sha-256 for local and network connections alike (the default is trust for local).
      POSTGRES_INITDB_ARGS: --data-checksums --auth-local=scram-sha-256 --auth-host=scram-sha-256 --pwfile=/run/secrets/af_bootstrap
    ports:
      - target: 5432
        published: "${AF_PG_PORT:-55432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/agent-factory/pg_hba.conf:ro
      - ./postgres/entrypoint.sh:/etc/agent-factory/entrypoint.sh:ro
    secrets:
      - af_bootstrap
      - af_migrator
      - af_api
      - af_control
      - af_backup
      - af_reader
      - af_temporal
    healthcheck:
      # "healthy" means a usable database, not only a server that answers. Three things, in this order, all must hold:
      #  1. pg_isready over TCP (the entrypoint's temporary init server listens on the unix socket only, so a TCP answer
      #     comes from the final server);
      #  2. the marker .af-init-complete of the data directory, the record that the initialisation finished (see
      #     deploy/postgres/entrypoint.sh and init/99-finish.sh);
      #  3. a real login as af_backup to the application database and a trivial query, which proves that the roles exist
      #     and their passwords are the ones in the secret files.
      # The password reaches psql through ONE fixed passfile of mode 0600 in tmpfs, which the wrapper rewrites from the
      # secret file at every start of the container. The check makes no file of its own: docker kills a check that runs
      # past its timeout with SIGKILL, so a per-check file (and the trap that would remove it) would be left behind.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U af_backup -d agent_factory -q
          && test -e /var/lib/postgresql/data/.af-init-complete
          && PGPASSFILE=/dev/shm/af-healthcheck.pgpass PGCONNECT_TIMEOUT=3 psql -w -h 127.0.0.1 -U af_backup -d agent_factory -Atc 'select 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

volumes:
  pgdata:

secrets:
  af_bootstrap:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_bootstrap
  af_migrator:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_migrator
  af_api:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_api
  af_control:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_control
  af_backup:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_backup
  af_reader:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_reader
  af_temporal:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_temporal
