# Agent Factory database server (phase 1). Development-only compose file.
#
# Start:  AF_SECRETS_DIR=<directory made by deploy/setup-secrets.ts> docker compose -f factory/deploy/compose.yml up -d
# The stack refuses to start without AF_SECRETS_DIR: there is no default inside the repository, and no password
# text anywhere in this file or in the environment of the container.
# AF_PG_PORT (default 55432) is the port on 127.0.0.1; the server is never published on another address.
# Temporal (services temporal-setup, temporal and, with --profile ui, temporal-ui) is part of the same stack; its ports
# AF_TEMPORAL_PORT (7233) and AF_TEMPORAL_UI_PORT (8233) are on 127.0.0.1 as well. `up -d postgres` starts the database alone.
# The service proxy (TLS front, mTLS for Temporal gRPC) is the one entrance that may leave 127.0.0.1, by the setting AF_PROXY_BIND.
# Container, volume and network names derive from the project name, so a test project (-p) never meets this one.

name: agent-factory

services:
  postgres:
    # PostgreSQL 16 with pgvector 0.8.7, pinned by version and by digest (the digest wins; the tag documents it).
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    restart: unless-stopped
    stop_grace_period: 30s
    # The wrapper (deploy/postgres/entrypoint.sh) hands the image's entrypoint the bootstrap password without any
    # variable or argument (and never a trust rule), writes the healthcheck's passfile, and serves a data directory only after a recorded complete initialisation (it refuses one
    # that holds PG_VERSION but no marker): see it and docs/agent-factory/deployment.md "No password in any environment"
    # and "A start that refuses".
    entrypoint: ["bash", "/etc/agent-factory/entrypoint.sh"]
    command: ["postgres", "-c", "hba_file=/etc/agent-factory/pg_hba.conf"]
    environment:
      POSTGRES_USER: af_bootstrap
      POSTGRES_DB: postgres
      # No POSTGRES_PASSWORD, no POSTGRES_PASSWORD_FILE and no POSTGRES_HOST_AUTH_METHOD: a trust rule is never asked
      # for, so none can ever be written to the volume (a SIGKILL at any instant included). The image's check that a
      # password is given is met inside the wrapper process (deploy/postgres/entrypoint.sh), with a constant that is
      # not the secret, so nothing in the container's configuration holds a password. The password reaches initdb
      # through --pwfile (a path to the secret file), and the image's own psql calls authenticate through a libpq
      # service file that the wrapper writes into tmpfs.
      # Checksums on pages, and scram-sha-256 for local and network connections alike (the default is trust for local).
      POSTGRES_INITDB_ARGS: --data-checksums --auth-local=scram-sha-256 --auth-host=scram-sha-256 --pwfile=/run/secrets/af_bootstrap
    ports:
      - target: 5432
        published: "${AF_PG_PORT:-55432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/agent-factory/pg_hba.conf:ro
      - ./postgres/entrypoint.sh:/etc/agent-factory/entrypoint.sh:ro
    secrets:
      - af_bootstrap
      - af_migrator
      - af_api
      - af_control
      - af_backup
      - af_reader
      - af_temporal
    healthcheck:
      # "healthy" means a usable database, not only a server that answers. Three things, in this order, all must hold:
      #  1. pg_isready over TCP (the entrypoint's temporary init server listens on the unix socket only, so a TCP answer
      #     comes from the final server);
      #  2. the marker .af-init-complete of the data directory, the record that the initialisation finished (see
      #     deploy/postgres/entrypoint.sh and init/99-finish.sh);
      #  3. a real login as af_backup to the application database and a trivial query, which proves that the roles exist
      #     and their passwords are the ones in the secret files.
      # The password reaches psql through ONE fixed passfile of mode 0600 in tmpfs, which the wrapper rewrites from the
      # secret file at every start of the container. The check makes no file of its own: docker kills a check that runs
      # past its timeout with SIGKILL, so a per-check file (and the trap that would remove it) would be left behind.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U af_backup -d agent_factory -q
          && test -e /var/lib/postgresql/data/.af-init-complete
          && PGPASSFILE=/dev/shm/af-healthcheck.pgpass PGCONNECT_TIMEOUT=3 psql -w -h 127.0.0.1 -U af_backup -d agent_factory -Atc 'select 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # Temporal (phase 3). Three services, all stored in the one Postgres above: persistence in the database af_temporal and
  # SQL visibility in af_temporal_visibility (no Elasticsearch, no auto-setup image). Versions and the upgrade rule:
  # docs/agent-factory/deployment.md, "Temporal". The images are pinned by version and by digest like postgres (the digest
  # wins; the tag documents it).
  #
  # The schema step: creates the schema of both databases on the first start and applies every newer versioned file on a
  # later one, forward only; it exits when done and the server waits for that exit.
  temporal-setup:
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    # A one-shot job: never restarted by docker (a host reboot included); `docker compose up` runs it again every time.
    restart: "no"
    # Root only to read the secret file (mode 0600, owned by the host user); the script runs temporal-sql-tool as the
    # image's user `temporal` (deploy/temporal/setup-schema.sh).
    user: "0:0"
    entrypoint: ["sh", "/etc/temporal/setup-schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./temporal/setup-schema.sh:/etc/temporal/setup-schema.sh:ro
    tmpfs:
      # The password handover file between the root part and the `temporal` part of the script, removed as soon as it is
      # read: in memory only, never in the layer or the host.
      - /run/af-temporal-setup:mode=0700,size=1m
    secrets:
      - af_temporal

  temporal:
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    restart: unless-stopped
    stop_grace_period: 30s
    # Root only to read the secret file and write the config into tmpfs; the server runs as the image's user `temporal`
    # (deploy/temporal/server-entrypoint.sh). The config template carries no password, the wrapper adds it in tmpfs.
    user: "0:0"
    entrypoint: ["sh", "/etc/temporal/server-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal-setup:
        condition: service_completed_successfully
    # AF_TEMPORAL_PORT (default 7233) is the frontend gRPC port on 127.0.0.1; never published on another address.
    ports:
      - target: 7233
        published: "${AF_TEMPORAL_PORT:-7233}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ./temporal/config.yaml.tmpl:/etc/temporal/config.yaml.tmpl:ro
      - ./temporal/server-entrypoint.sh:/etc/temporal/server-entrypoint.sh:ro
    tmpfs:
      - /run/af-temporal:mode=0700,size=1m
    secrets:
      - af_temporal
    healthcheck:
      # The HTTP API of the frontend answers a request that needs the cluster record in the database, so "healthy" means a
      # server that reached its persistence, not only an open port.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7243/api/v1/cluster-info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # The web UI: off unless the profile `ui` is asked for (docker compose --profile ui up -d). Port AF_TEMPORAL_UI_PORT
  # (default 8233) on 127.0.0.1 only. It holds no data of its own and no secret.
  temporal-ui:
    image: temporalio/ui:2.58.1@sha256:ac3c13eddb4547d830991bb5eee93a5d97140134522b7297fdb2be1fe25ef925
    profiles: ["ui"]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - target: 8080
        published: "${AF_TEMPORAL_UI_PORT:-8233}"
        host_ip: 127.0.0.1
        protocol: tcp

  # The TLS front (phase 3, package 49): Envoy, pinned by version and by digest like the others. It is the only external
  # entrance of the stack (security.md T25): mTLS in front of Temporal gRPC with a method allowlist per certificate identity
  # (S6), and TLS in front of the API. Its three files (CA certificate, server certificate and key) come from
  # `npm run proxy-certs` into ${AF_SECRETS_DIR}/proxy; without them this service refuses to start and the rest of the stack
  # is not affected. Rules and rotation: docs/agent-factory/deployment.md, "TLS proxy".
  proxy:
    image: envoyproxy/envoy:v1.34.1@sha256:007da57c2c328a90bd4e6d99b70bd899132f1b4a9426ccafe25437cf84a60c14
    restart: unless-stopped
    # Root only to read the secret files; Envoy runs as the image's user `envoy` (deploy/proxy/entrypoint.sh).
    user: "0:0"
    entrypoint: ["bash", "/etc/agent-factory/entrypoint.sh"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      # The API is a host process on 127.0.0.1:${AF_API_PORT}; the container reaches it through host.docker.internal.
      AF_API_PORT: "${AF_API_PORT:-8787}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The external address is the setting AF_PROXY_BIND (default 127.0.0.1: nothing leaves the machine until the operator
    # names an address). Ports: AF_PROXY_TEMPORAL_PORT (Temporal gRPC, mTLS) and AF_PROXY_API_PORT (the API, TLS).
    ports:
      - target: 7234
        published: "${AF_PROXY_TEMPORAL_PORT:-7234}"
        host_ip: ${AF_PROXY_BIND:-127.0.0.1}
        protocol: tcp
      - target: 8443
        published: "${AF_PROXY_API_PORT:-8443}"
        host_ip: ${AF_PROXY_BIND:-127.0.0.1}
        protocol: tcp
    volumes:
      - ./proxy/envoy.yaml.tmpl:/etc/agent-factory/envoy.yaml.tmpl:ro
      - ./proxy/entrypoint.sh:/etc/agent-factory/entrypoint.sh:ro
    tmpfs:
      - /run/af-proxy:mode=0700,size=1m
    secrets:
      - af_proxy_ca_crt
      - af_proxy_server_crt
      - af_proxy_server_key
    healthcheck:
      # The image has no curl or wget; bash opens the admin port (127.0.0.1 inside the container) and asks /ready, which
      # answers 200 once the listeners are up. HTTP/1.1 is required: the admin port answers 426 to HTTP/1.0.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  pgdata:

secrets:
  af_bootstrap:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_bootstrap
  af_migrator:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_migrator
  af_api:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_api
  af_control:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_control
  af_backup:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_backup
  af_reader:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_reader
  af_temporal:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/af_temporal
  # Made by `npm run proxy-certs` (deploy/proxy/certs.ts), not by setup-secrets.ts. Compose reads the file only when a service
  # that names the secret starts, so `up -d postgres` works before these exist.
  af_proxy_ca_crt:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/proxy/ca.crt
  af_proxy_server_crt:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/proxy/server.crt
  af_proxy_server_key:
    file: ${AF_SECRETS_DIR:?set AF_SECRETS_DIR to the directory made by deploy/setup-secrets.ts}/proxy/server.key
